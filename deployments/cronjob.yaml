apiVersion: batch/v1
kind: CronJob
metadata:
  name: silence-manager
  namespace: monitoring
spec:
  # Run every 15 minutes
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: silence-manager
        spec:
          serviceAccountName: silence-manager
          restartPolicy: OnFailure
          containers:
          - name: silence-manager
            image: silence-manager:latest
            imagePullPolicy: IfNotPresent
            env:
            # Alertmanager Configuration
            # When ALERTMANAGER_URL is not set, auto-discovery will be enabled
            # to search for Alertmanager services across all namespaces
            # - name: ALERTMANAGER_URL
            #   value: "http://alertmanager:9093"
            - name: ALERTMANAGER_AUTH_TYPE
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: alertmanager-auth-type
                  optional: true
            - name: ALERTMANAGER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: alertmanager-username
                  optional: true
            - name: ALERTMANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: alertmanager-password
                  optional: true
            - name: ALERTMANAGER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: alertmanager-bearer-token
                  optional: true

            # Ticket System Configuration (jira, linear or pylon; default: jira)
            - name: TICKET_SYSTEM
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: ticket-system
                  optional: true

            # Jira Configuration (TICKET_SYSTEM=jira)
            - name: JIRA_URL
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: jira-url
                  optional: true
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: jira-username
                  optional: true
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: jira-api-token
                  optional: true
            - name: JIRA_PROJECT_KEY
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: jira-project-key
                  optional: true

            # Linear Configuration (TICKET_SYSTEM=linear)
            - name: LINEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: linear-api-key
                  optional: true
            - name: LINEAR_TEAM_ID
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: linear-team-id
                  optional: true

            # Pylon Configuration (TICKET_SYSTEM=pylon)
            - name: PYLON_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: silence-manager-secrets
                  key: pylon-api-token
                  optional: true
            - name: PYLON_ACCOUNT_ID
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: pylon-account-id
                  optional: true
            - name: PYLON_REQUESTER_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: pylon-requester-email
                  optional: true

            # Sync Configuration
            - name: SYNC_ANNOTATION_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: sync-annotation-prefix
                  optional: true
            - name: SYNC_EXPIRY_THRESHOLD_HOURS
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: sync-expiry-threshold-hours
                  optional: true
            - name: SYNC_EXTENSION_DURATION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: sync-extension-duration-hours
                  optional: true
            - name: SYNC_DEFAULT_SILENCE_DURATION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: sync-default-silence-duration-hours
                  optional: true
            - name: SYNC_CHECK_ALERTS
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: sync-check-alerts
                  optional: true

            # Metrics Configuration (Optional)
            - name: METRICS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-enabled
                  optional: true
            - name: METRICS_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-backend
                  optional: true
            - name: METRICS_URL
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-url
                  optional: true
            - name: METRICS_PUSHGATEWAY_JOB_NAME
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-pushgateway-job-name
                  optional: true
            - name: METRICS_OTEL_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-otel-insecure
                  optional: true
            - name: METRICS_DISCOVERY_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-discovery-service-name
                  optional: true
            - name: METRICS_DISCOVERY_SERVICE_LABEL
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-discovery-service-label
                  optional: true
            - name: METRICS_DISCOVERY_PORT
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-discovery-port
                  optional: true
            - name: METRICS_DISCOVERY_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: silence-manager-config
                  key: metrics-discovery-namespaces
                  optional: true
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
