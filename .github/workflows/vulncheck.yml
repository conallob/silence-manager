name: Vulnerability Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so newly published advisories are caught without a code change
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Use the Go version from go.mod: govulncheck must be built with a Go
    # version at least as new as the code it analyzes.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    # Fails when a known vulnerability is reachable from this module's code
    # (govulncheck does not fail on vulnerable dependencies that are never called).
    - name: Run govulncheck
      run: govulncheck ./...
